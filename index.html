<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Control Task - AR Surface 18</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
    <script src="src/ar-surface-component.js"></script>

    <style>
        html,
        body {
            margin: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .a-enter-vr,
        .a-enter-ar,
        .a-orientation-modal,
        .a-dialog,
        .a-modal {
            display: none !important;
        }
    </style>
</head>

<body>
    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
        renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;">

        <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.9" position="1 2 1"></a-light>

        <a-marker type="pattern" url="src/pattern-18.patt">
            <a-entity drop-surface-18 position="0 0 0" rotation="0 0 0" scale="1 1 1"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
