<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Surface Demo</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: #0b0f14;
            font-family: Arial, Helvetica, sans-serif;
        }

        .overlay {
            color: #e8edf2;
            left: 0;
            padding: 16px 18px;
            pointer-events: none;
            position: fixed;
            right: 0;
            top: 0;
            z-index: 10;
        }

        .title {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 6px;
        }

        .subtitle {
            color: #a9b4bf;
            font-size: 13px;
            margin: 0;
        }
    </style>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="./ar-surface-component.js"></script>
</head>
<body>
    <div class="overlay">
        <p class="title">Surface Demo</p>
        <p class="subtitle">The figure is shown immediately without camera or marker tracking.</p>
    </div>

    <a-scene
        background="color: #0b0f14"
        embedded
        loading-screen="enabled: false;"
        renderer="antialias: true; colorManagement: true; physicallyCorrectLights: false;"
    >
        <a-entity position="0 0 4.5">
            <a-entity camera look-controls="enabled: false" wasd-controls="enabled: false"></a-entity>
        </a-entity>

        <a-entity light="type: ambient; intensity: 0.9; color: #ffffff"></a-entity>
        <a-entity light="type: directional; intensity: 0.95; color: #ffffff" position="1.5 2.2 2.5"></a-entity>
        <a-entity light="type: directional; intensity: 0.35; color: #7dd3fc" position="-2 1 -1"></a-entity>

        <a-entity surface-16 position="0 0 0"></a-entity>
    </a-scene>
</body>
</html>
