<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PA3/PA4 - AR Surface 16</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #debug-status {
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            display: none;
            font: 16px Arial, sans-serif;
            left: 12px;
            max-width: calc(100vw - 24px);
            padding: 10px 12px;
            position: fixed;
            top: 12px;
            z-index: 10;
        }
    </style>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
    <script src="./ar-surface-component.js"></script>
</head>
<body>
    <div id="debug-status">Loading AR scene...</div>
    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;"
        loading-screen="enabled: false;"
        renderer="logarithmicDepthBuffer: true;"
    >
        <a-marker id="surface-marker" type="pattern" url="./vr-surface-marker.patt">
            <a-entity surface-16 position="0 0.5 0" scale="1 1 1"></a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
    <script>
        (function() {
            let params = new URLSearchParams(window.location.search);
            if (params.get('debug') !== '1') {
                return;
            }

            let status = document.getElementById('debug-status');
            let marker = document.getElementById('surface-marker');

            function setStatus(message) {
                status.style.display = 'block';
                status.textContent = message;
            }

            setStatus('Opening camera...');

            window.addEventListener('camera-init', function() {
                setStatus('Camera ready. Point at vr-surface-marker.png.');
            });

            window.addEventListener('camera-error', function(event) {
                let detail = event && event.detail && event.detail.error ? String(event.detail.error) : '';
                setStatus(detail ? 'Camera error: ' + detail : 'Camera error.');
            });

            marker.addEventListener('markerFound', function() {
                setStatus('Marker found.');
            });

            marker.addEventListener('markerLost', function() {
                setStatus('Marker lost.');
            });
        }());
    </script>
</body>
</html>
